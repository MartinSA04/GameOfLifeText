name: CI

on:
  pull_request:
  push:
    branches: ["**"]

permissions:
  contents: read

# A rapid push series only needs the newest commit checked.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  python:
    name: python (planner + gui)
    # Every branch push runs the suite already, so the pull_request event would
    # only duplicate it for same-repo PRs. Fork PRs still need it: their pushes
    # do not trigger workflows here.
    if: github.event_name == 'push' || github.event.pull_request.head.repo.full_name != github.repository
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      # Pinned to the exact release: setup-uv publishes moving major tags only
      # up to v7, so `@v9` does not resolve.
      - uses: astral-sh/setup-uv@v9.0.0
        with:
          enable-cache: true
      # PySide6 ships its own Qt build but links against these system libraries,
      # and tests/test_gui.py drives real widgets under QT_QPA_PLATFORM=offscreen
      # — without them the platform plugin fails to load. Same list as
      # .devcontainer/post-create.sh, minus the on-screen X11 plugin's xcb-*
      # set, which offscreen rendering does not need.
      - name: Install the Qt runtime libraries
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            libegl1 libgl1 libglib2.0-0 libdbus-1-3 libfontconfig1 fonts-dejavu-core
      - run: uv sync --frozen
      - run: uv run ruff check
      - run: uv run ruff format --check
      - run: uv run ty check
      - run: uv run pytest

  web:
    name: web (typescript bundle)
    if: github.event_name == 'push' || github.event.pull_request.head.repo.full_name != github.repository
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
      # scripts/build_web.py is standard-library only, so the bundle needs an
      # interpreter but not the project's PySide6 environment.
      - uses: astral-sh/setup-uv@v9.0.0
        with:
          enable-cache: true
      - run: npm ci
      - run: npm run lint
      - run: npm run format:check
      - run: npm run lint:md
      - run: npm run typecheck
      - run: npm test
      # The build is the only gate on the bundle's own contracts: that tsc emits
      # the module graph the page loads, and that the worker's Python payload
      # ships with it. A missing file here is a blank page on the deployed site.
      - run: npm run build
      - name: Assert the bundle is complete
        run: |
          for file in index.html styles.css favicon.svg src/main.js engine-worker.js \
            pysrc/manifest.json pysrc/game_of_life_text/browser.py; do
            [ -s "dist/$file" ] || { echo "missing from dist/: $file"; exit 1; }
          done
